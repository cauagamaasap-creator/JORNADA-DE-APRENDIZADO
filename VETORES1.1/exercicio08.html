<script>
let vetor = [];
let positivos = 0;
let negativos = 0;
let zeros = 0;

for(let i = 0; i < 10; i++){
    vetor[i] = parseInt(prompt("Digite um numero:"));
}

for(let i = 0; i < 10; i++){
    if(vetor[i] > 0){
        positivos++;
    }
    else if(vetor[i] < 0){
        negativos++;
    }
    else{
        zeros++;
    }
}

alert("Positivos: " + positivos);
alert("Negativos: " + negativos);
alert("Zeros: " + zeros);
</script>
