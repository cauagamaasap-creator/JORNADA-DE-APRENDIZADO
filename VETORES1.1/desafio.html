<script>
let vetor = [];
let aux = 0;

for(let i = 0; i < 10; i++){
    vetor[i] = parseInt(prompt("Digite um numero:"));
}

for(let i = 0; i < 10; i++){
    for(let j = i + 1; j < 10; j++){
        if(vetor[i] > vetor[j]){
            aux = vetor[i];
            vetor[i] = vetor[j];
            vetor[j] = aux;
        }
    }
}

alert("Numeros em ordem crescente: " + vetor);
</script>
