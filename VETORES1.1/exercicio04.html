<script>
let vetor = [];

for(let i = 0; i < 10; i++){
    vetor[i] = parseInt(prompt("Digite um numero:"));
}

let maior = vetor[0];
let menor = vetor[0];

for(let i = 0; i < 10; i++){
    if(vetor[i] > maior){
        maior = vetor[i];
    }

    if(vetor[i] < menor){
        menor = vetor[i];
    }
}

alert("Maior numero: " + maior);
alert("Menor numero: " + menor);
</script>
