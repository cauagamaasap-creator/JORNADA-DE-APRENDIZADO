<script>
let vetorA = [];
let vetorB = [];
let vetorC = [];

for(let i = 0; i < 5; i++){
    vetorA[i] = parseInt(prompt("Digite um numero para o vetor A:"));
}

for(let i = 0; i < 5; i++){
    vetorB[i] = parseInt(prompt("Digite um numero para o vetor B:"));
}

for(let i = 0; i < 5; i++){
    vetorC[i] = vetorA[i] + vetorB[i];
}

alert("Vetor A: " + vetorA);
alert("Vetor B: " + vetorB);
alert("Vetor C: " + vetorC);
</script>
